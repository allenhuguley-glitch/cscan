name: crypto-scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: scanner_state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -o pipefail
          python -u crypto_movement_scanner.py --once --top 150 --no-social | tee latest.txt
      - name: Phone view
        if: always()
        run: python phone_view.py || true
      - name: Buy checks (test only, RSI + up/down volume)
        if: always()
        run: python buy_checks.py || true
      - name: Early checks (test only, new listings + EARLY + OBV)
        if: always()
        run: python early_checks.py || true
      - name: Signal outcomes (test only, hourly)
        if: always()
        run: |
          if [ "$(date -u +%M | sed 's/^0//')" -lt 5 ] || [ ! -f signal_outcomes.csv ]; then python signal_outcomes.py || true; fi
      - name: Save results to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.txt latest.json $(ls -d history logs signal_outcomes.csv phone.txt phone.html scanner_log_v4.csv buy_checks_log.csv early_checks_log.csv buy_checks_errors.csv listings_log.csv known_markets.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Update scan results"
          git pull --rebase --autostash -X theirs origin main
          git push
      - name: Save alert memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner_state.json
          key: state-${{ github.run_id }}