name: crypto-scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: scanner_state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -o pipefail
          python -u crypto_movement_scanner.py --once | tee latest.txt
      - name: Save results to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.txt
          git diff --cached --quiet || git commit -m "Update scan results"
          git push
      - name: Save alert memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scanner_state.json
          key: state-${{ github.run_id }}
