name: selfcheck
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfcheck
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt requests
      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: selfcheck_state.json
          key: selfcheck-${{ github.run_id }}
          restore-keys: selfcheck-
      - name: Self check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python selfcheck.py
      - name: Save alert memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: selfcheck_state.json
          key: selfcheck-${{ github.run_id }}
