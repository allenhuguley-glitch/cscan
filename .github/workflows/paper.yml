name: paper
on:
  workflow_dispatch:
    inputs:
      mode:
        description: backtest or live
        default: live
concurrency:
  group: paper
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run paper trader
        run: python paper_trader.py "${{ github.event.inputs.mode || 'live' }}"
      - name: Save results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          for f in paper_log.csv backtest_results.csv; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "paper results"
          git pull --rebase -X theirs origin main
          git push
